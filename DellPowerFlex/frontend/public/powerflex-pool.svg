<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="A storage pool with no controller: clients address nodes directly, and every node rebuilds">
  <rect width="420" height="200" fill="#0d1420"/>

  <!-- clients -->
  <rect x="20" y="18" width="380" height="26" rx="4" fill="#12233a" stroke="#3d5a9e" stroke-width="1"/>
  <text x="210" y="35" fill="#4f7cff" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">Clients — each holds the chunk map</text>

  <!-- direct paths, no tier in between -->
  <g stroke="#2b3950" stroke-width="1" fill="none">
    <path d="M 210 44 L 55 96"/>
    <path d="M 210 44 L 117 96"/>
    <path d="M 210 44 L 179 96"/>
    <path d="M 210 44 L 241 96"/>
    <path d="M 210 44 L 303 96"/>
    <path d="M 210 44 L 365 96"/>
  </g>
  <text x="210" y="72" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">nothing in between</text>

  <!-- nodes -->
  <g>
    <rect x="24" y="96" width="62" height="46" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
    <rect x="86" y="96" width="62" height="46" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1" transform="translate(0,0)"/>
    <rect x="148" y="96" width="62" height="46" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
    <rect x="210" y="96" width="62" height="46" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
    <rect x="272" y="96" width="62" height="46" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
    <rect x="334" y="96" width="62" height="46" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
  </g>
  <text x="55" y="123" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Node</text>
  <text x="117" y="123" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Node</text>
  <text x="179" y="123" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Node</text>
  <text x="241" y="123" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Node</text>
  <text x="303" y="123" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Node</text>
  <text x="365" y="123" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Node</text>

  <!-- the many-to-many rebuild mesh -->
  <g stroke="#0672cb" stroke-width="1" fill="none" opacity="0.8">
    <path d="M 55 142 Q 86 168 117 142"/>
    <path d="M 117 142 Q 148 168 179 142"/>
    <path d="M 179 142 Q 210 168 241 142"/>
    <path d="M 241 142 Q 272 168 303 142"/>
    <path d="M 303 142 Q 334 168 365 142"/>
    <path d="M 55 142 Q 148 180 241 142"/>
    <path d="M 117 142 Q 210 180 303 142"/>
    <path d="M 179 142 Q 272 180 365 142"/>
  </g>
  <text x="210" y="194" fill="#0672cb" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">rebuild: every node reconstructs a sliver, from every other</text>
</svg>
