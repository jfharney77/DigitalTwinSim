stages:
  - validate
  - deploy

# components.json is generated from disk, and the component tables in CLAUDE.md
# and README.md are generated from components.json. Either drifting fails here.
component-index:
  stage: validate
  image: python:3.12
  script:
    - python3 scripts/gen_components.py --check
    - python3 scripts/gen_docs.py --check

# One suite, sharded by component: every job runs `pytest <shard>` from the
# repo root, so the root pytest.ini/conftest.py (and twinkit) are in play
# exactly as they are for a bare `pytest`. The shard list is checked against
# disk by `scripts/gen_root_pytest.py --check`.
root-pytest-conftests:
  stage: validate
  image: python:3.12
  script:
    - python3 scripts/gen_root_pytest.py --check

pytest:
  stage: validate
  image: python:3.12
  parallel:
    matrix:
      - SHARD:
          - twinkit
          - CustomerSetup
          - Learn
          - DellAlienware
          - DellCircularDesign
          - DellCloudIQ
          - DellCyberDetect
          - DellExascale
          - DellFortZero
          - DellIDRAC
          - DellIR7000
          - DellNativeEdge
          - DellPowerEdgeR760
          - DellPowerEdgeR760Thermal
          - DellPowerEdgeXE9680
          - DellPowerEdgeXE9712
          - DellPowerFlex
          - DellPowerMax
          - DellPowerProtect
          - DellPowerScale
          - DellPowerStore
          - DellPowerStoreElite
          - DellPowerSwitchE3200
          - DellPowerSwitchSN6000
          - DellPrivateCloud
          - DellProMaxPlus
          - DellQuantumX800
          - DellVxRail
          - GPU
          - PhysicsAIFactory
          - PhysicsCDU
          - PhysicsClient
          - PhysicsCompute
          - PhysicsData
          - PhysicsDataDomain
          - PhysicsDisplay
          - PhysicsFabric
          - PhysicsFleet
          - PhysicsLifecycle
          - PhysicsME5
          - PhysicsMX7000
          - PhysicsRackPower
          - PhysicsResilience
          - PhysicsStorage
          - PhysicsXR
          - compose
  before_script:
    - pip install -q "fastapi>=0.110" "pydantic>=2.6" "pytest>=8.0" "httpx>=0.27"
  script:
    - pytest -q "$SHARD"

validate-frontend:
  stage: validate
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

deploy-frontend:
  stage: deploy
  image: node:20
  needs: [validate-frontend]
  script:
    - npm install -g @railway/cli
    - railway status
    - rm -rf frontend/dist
    - railway up --service DigitalTwinSim-frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Browser smoke tests: start each component's backend + frontend, load every
# route in its frontend/smoke.json in Chromium, and fail on page errors,
# console errors, failed /api calls or an error fallback (see e2e/README.md).
# allow_failure for now: only GPU and DellPowerEdgeR760 have manifests yet
# (the rest report "no manifest" and do not fail), and the job has not had a
# green run on the CI runners — it starts ~40 backends one after another and
# builds each venv from scratch. Drop allow_failure once it is green and every
# component has a manifest. The image tag must match @playwright/test in the
# root package.json, or the bundled browser will not be found.
e2e-smoke:
  stage: validate
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  allow_failure: true
  timeout: 90m
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3-venv python3-pip curl >/dev/null
    - npm ci
  script:
    - scripts/smoke.sh --all
  artifacts:
    when: always
    paths:
      - e2e/artifacts/
    expire_in: 1 week

# ---- the hosted site ------------------------------------------------------
# scripts/build_site.sh assembles site/: every static-ready twin as plain
# files (snapshotted GETs, prebaked POSTs, the engine in a Pyodide bundle for
# anything else), plus the root index, Learn/ and CustomerSetup/ with the
# hosted link resolver injected. Nothing starts a server here, and the
# generated output is never committed — see docs/STATIC_HOSTING.md.
#
# Size, measured on the full build (43 components): ~144 MB and ~2,300 files on
# disk, almost all of it snapshot JSON, which is what the Pages artifact and the
# project's storage quota count. Over the wire it is a fraction of that — Pages
# serves these files gzipped and a trace compresses about seventy to one — so the
# number to watch is the artifact/quota limit, not the reader's download.
#
# One definition, two jobs: `pages` publishes from the default branch, and
# `pages-preview` is the same build run manually on a branch, so a change to
# the site can be checked before it is merged (its artifact is browsable from
# the job page).
.site-build:
  stage: deploy
  image: node:20
  timeout: 90m
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv >/dev/null
    - python3 -m venv /tmp/site-venv
    - /tmp/site-venv/bin/pip install -q "fastapi>=0.110" "pydantic>=2.6"
    - npm ci
  script:
    # No component .venv exists here, so build_static.py runs under this one:
    # the engines are pure Python and need only fastapi + pydantic to import.
    - PATH=/tmp/site-venv/bin:$PATH scripts/build_site.sh
    - rm -rf public && mv site public
    - du -sh public && cat public/hosted.json

pages:
  extends: .site-build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages-preview:
  extends: .site-build
  when: manual
  allow_failure: true
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
