stages:
  - validate
  - deploy

# components.json is generated from disk, and the component tables in CLAUDE.md
# and README.md are generated from components.json. Either drifting fails here.
component-index:
  stage: validate
  image: python:3.12
  script:
    - python3 scripts/gen_components.py --check
    - python3 scripts/gen_docs.py --check

validate-frontend:
  stage: validate
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

deploy-frontend:
  stage: deploy
  image: node:20
  needs: [validate-frontend]
  script:
    - npm install -g @railway/cli
    - railway status
    - rm -rf frontend/dist
    - railway up --service DigitalTwinSim-frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
