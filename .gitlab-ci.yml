stages:
  - validate
  - deploy

validate-frontend:
  stage: validate
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

deploy-frontend:
  stage: deploy
  image: node:20
  needs: [validate-frontend]
  script:
    - npm install -g @railway/cli
    - railway status
    - rm -rf frontend/dist
    - railway up --service DigitalTwinSim-frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
