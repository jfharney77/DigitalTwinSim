<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-label="A compiled model crosses the PCIe boundary once into dedicated AI memory">
  <rect width="420" height="190" fill="#0d1420"/>

  <text x="90" y="20" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" letter-spacing="1.2" text-anchor="middle">HOST</text>
  <text x="320" y="20" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" letter-spacing="1.2" text-anchor="middle">INFERENCE CARD</text>

  <!-- host side -->
  <rect x="20" y="32" width="140" height="34" rx="4" fill="#12233a" stroke="#3d5a9e" stroke-width="1"/>
  <text x="90" y="53" fill="#4f7cff" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Host CPU</text>

  <rect x="20" y="74" width="140" height="34" rx="4" fill="#16233a" stroke="#3a5288" stroke-width="1"/>
  <text x="90" y="95" fill="#5f88d8" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">System memory</text>

  <rect x="20" y="116" width="140" height="34" rx="4" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
  <text x="90" y="133" fill="#7b8bb5" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">NVMe — model file</text>
  <text x="90" y="145" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle">61 GB at rest</text>

  <!-- boundary -->
  <rect x="188" y="32" width="26" height="118" rx="4" fill="#2b2412" stroke="#6b5a2b" stroke-width="1"/>
  <text x="201" y="97" fill="#c9a94f" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 201 97)">PCIe</text>

  <!-- the one crossing -->
  <path d="M 160 133 L 188 133" stroke="#0672cb" stroke-width="2.5" fill="none"/>
  <path d="M 214 118 L 244 118" stroke="#0672cb" stroke-width="2.5" fill="none"/>
  <path d="M 201 133 L 201 118" stroke="#0672cb" stroke-width="2.5" fill="none"/>
  <text x="201" y="168" fill="#0672cb" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">crossed once, at load</text>

  <!-- card side -->
  <rect x="244" y="32" width="72" height="40" rx="4" fill="#1c1f3f" stroke="#5a4fc9" stroke-width="1"/>
  <text x="280" y="56" fill="#8f7fff" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">AI-100</text>

  <rect x="324" y="32" width="72" height="40" rx="4" fill="#1c1f3f" stroke="#5a4fc9" stroke-width="1"/>
  <text x="360" y="56" fill="#8f7fff" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">AI-100</text>

  <rect x="244" y="80" width="152" height="70" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
  <text x="320" y="108" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">64 GB AI memory</text>
  <text x="320" y="126" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">61 GB resident — 109B parameters</text>
  <text x="320" y="141" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle">read in place, every token, forever</text>

  <text x="320" y="172" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">no network required after this point</text>
</svg>
