[pytest]
# One suite for the whole repo: `pytest` at the root runs twinkit's tests and
# every component's backend tests.
#
# importlib import mode is what makes it possible — 42 components each have a
# tests/test_engine.py, and the classic import mode would key them all on the
# same module name. The `app` package collision is handled by the per-backend
# conftest.py files (see conftest.py at the root).
#
# Shard it in CI with `pytest DellPowerMax` or `-k`, or run one component the
# way you always did: `cd DellPowerMax/backend && pytest`.
addopts = --import-mode=importlib
norecursedirs = .git .venv node_modules dist __pycache__ *.egg-info sessions tours cuda public
python_files = test_*.py
