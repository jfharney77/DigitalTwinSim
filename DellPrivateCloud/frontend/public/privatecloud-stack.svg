<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-label="Disaggregated pools under four interchangeable hypervisor slots and one control plane">
  <rect width="420" height="240" fill="#0d1420"/>

  <!-- control plane -->
  <rect x="20" y="18" width="380" height="26" rx="4" fill="#2b2412" stroke="#6b5a2b" stroke-width="1"/>
  <text x="210" y="35" fill="#c9a94f" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">One control plane</text>

  <!-- workloads -->
  <rect x="20" y="52" width="380" height="26" rx="4" fill="#12233a" stroke="#3d5a9e" stroke-width="1"/>
  <text x="210" y="69" fill="#4f7cff" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Workloads — indifferent to everything below</text>

  <!-- four identical hypervisor slots; two in use, two available -->
  <g font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">
    <rect x="20" y="90" width="90" height="30" rx="4" fill="#1c1f3f" stroke="#5a4fc9" stroke-width="1"/>
    <text x="65" y="109" fill="#8f7fff">VMware</text>

    <rect x="118" y="90" width="90" height="30" rx="4" fill="#1c1f3f" stroke="#3a3560" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
    <text x="163" y="105" fill="#6a5fa0" opacity="0.8">Red Hat</text>
    <text x="163" y="116" fill="#5a6b82" font-size="8" opacity="0.8">available</text>

    <rect x="216" y="90" width="90" height="30" rx="4" fill="#1c1f3f" stroke="#5a4fc9" stroke-width="1"/>
    <text x="261" y="109" fill="#8f7fff">Nutanix</text>

    <rect x="314" y="90" width="90" height="30" rx="4" fill="#1c1f3f" stroke="#3a3560" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
    <text x="359" y="105" fill="#6a5fa0" opacity="0.8">Microsoft</text>
    <text x="359" y="116" fill="#5a6b82" font-size="8" opacity="0.8">available</text>
  </g>

  <!-- three separate lifts: three purchases, three lines -->
  <g stroke="#2b3950" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <path d="M 82 156 L 82 120"/>
    <path d="M 210 156 L 210 120"/>
    <path d="M 338 156 L 338 120"/>
  </g>

  <!-- three pools, side by side -->
  <g font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">
    <rect x="20" y="156" width="124" height="34" rx="4" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
    <text x="82" y="177" fill="#6ab585">Compute pool</text>

    <rect x="148" y="156" width="124" height="34" rx="4" fill="#12282e" stroke="#2e5666" stroke-width="1"/>
    <text x="210" y="177" fill="#4fa0c9">Storage pool</text>

    <rect x="276" y="156" width="124" height="34" rx="4" fill="#241f33" stroke="#4a4066" stroke-width="1"/>
    <text x="338" y="177" fill="#8a7ab5">Network pool</text>
  </g>

  <!-- fabric -->
  <rect x="20" y="198" width="380" height="20" rx="4" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
  <text x="210" y="212" fill="#7b8bb5" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">Fabric</text>

  <text x="210" y="234" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">three pools, bought separately — every join is a decision you can revisit</text>
</svg>
