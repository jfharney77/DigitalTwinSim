<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"
     aria-label="Schematic of a PowerEdge XE9680 8-GPU HGX server, top-down">
  <!-- Self-contained schematic drawn for this project — not a Dell or NVIDIA
       product image. Palette matches the twin's dark diagram style. -->
  <rect x="0" y="0" width="640" height="380" fill="#0d1420"/>
  <text x="20" y="30" fill="#8fa3bd" font-family="monospace" font-size="15">POWEREDGE XE9680 — TOP-DOWN, SCHEMATIC</text>
  <text x="20" y="50" fill="#5a6b82" font-family="monospace" font-size="11">6U air-cooled · one HGX baseboard · NVLink ends at the chassis wall</text>

  <!-- chassis outline -->
  <rect x="20" y="70" width="600" height="280" rx="6" fill="none" stroke="#1f2935" stroke-width="2"/>

  <!-- front: NVMe bay -->
  <rect x="30" y="80" width="40" height="260" rx="3" fill="#241a2e" stroke="#5a4080"/>
  <text x="50" y="215" fill="#a07ac9" font-family="monospace" font-size="10" text-anchor="middle" transform="rotate(-90 50 215)">NVMe BAY</text>

  <!-- fan wall -->
  <rect x="78" y="80" width="46" height="126" rx="3" fill="#122b2b" stroke="#2e5c54"/>
  <rect x="78" y="214" width="46" height="126" rx="3" fill="#122b2b" stroke="#2e5c54"/>
  <text x="101" y="146" fill="#4fa08a" font-family="monospace" font-size="10" text-anchor="middle" transform="rotate(-90 101 146)">FANS</text>
  <text x="101" y="280" fill="#4fa08a" font-family="monospace" font-size="10" text-anchor="middle" transform="rotate(-90 101 280)">FANS</text>

  <!-- HGX baseboard field: 8 SXM GPUs -->
  <g fill="#2b2412" stroke="#6b5a2b">
    <rect x="134" y="80"  width="60" height="126" rx="3"/>
    <rect x="200" y="80"  width="60" height="126" rx="3"/>
    <rect x="266" y="80"  width="60" height="126" rx="3"/>
    <rect x="332" y="80"  width="60" height="126" rx="3"/>
    <rect x="134" y="214" width="60" height="126" rx="3"/>
    <rect x="200" y="214" width="60" height="126" rx="3"/>
    <rect x="266" y="214" width="60" height="126" rx="3"/>
    <rect x="332" y="214" width="60" height="126" rx="3"/>
  </g>
  <g fill="#c9a94f" font-family="monospace" font-size="10" text-anchor="middle">
    <text x="164" y="148">SXM 1</text><text x="230" y="148">SXM 2</text>
    <text x="296" y="148">SXM 3</text><text x="362" y="148">SXM 4</text>
    <text x="164" y="282">SXM 5</text><text x="230" y="282">SXM 6</text>
    <text x="296" y="282">SXM 7</text><text x="362" y="282">SXM 8</text>
  </g>

  <!-- NVSwitch strip: the wall where the domain ends -->
  <rect x="400" y="80" width="30" height="260" rx="3" fill="#1c1f3f" stroke="#5a4fc9"/>
  <text x="415" y="212" fill="#8f7fff" font-family="monospace" font-size="10" text-anchor="middle" transform="rotate(-90 415 212)">NVSWITCH — 8-GPU DOMAIN</text>

  <!-- host column -->
  <rect x="438" y="80" width="80" height="170" rx="3" fill="#241f33" stroke="#4a4066"/>
  <text x="478" y="160" fill="#8a7ab5" font-family="monospace" font-size="10" text-anchor="middle">2× XEON</text>
  <text x="478" y="176" fill="#8a7ab5" font-family="monospace" font-size="10" text-anchor="middle">32× DIMM</text>
  <rect x="438" y="258" width="80" height="34" rx="3" fill="#12282e" stroke="#2e5666"/>
  <text x="478" y="279" fill="#4fa0c9" font-family="monospace" font-size="10" text-anchor="middle">iDRAC</text>
  <rect x="438" y="300" width="80" height="40" rx="3" fill="#2b1a1a" stroke="#6b3a3a"/>
  <text x="478" y="324" fill="#c97a6a" font-family="monospace" font-size="10" text-anchor="middle">6× PSU</text>

  <!-- per-GPU NICs, one row each -->
  <g fill="#16281a" stroke="#3a6647">
    <rect x="526" y="80"  width="84" height="26" rx="3"/>
    <rect x="526" y="113" width="84" height="26" rx="3"/>
    <rect x="526" y="146" width="84" height="26" rx="3"/>
    <rect x="526" y="179" width="84" height="26" rx="3"/>
    <rect x="526" y="212" width="84" height="26" rx="3"/>
    <rect x="526" y="245" width="84" height="26" rx="3"/>
    <rect x="526" y="278" width="84" height="26" rx="3"/>
    <rect x="526" y="311" width="84" height="26" rx="3"/>
  </g>
  <g fill="#6ab585" font-family="monospace" font-size="9">
    <text x="534" y="97">NIC·GPU1</text><text x="534" y="130">NIC·GPU2</text>
    <text x="534" y="163">NIC·GPU3</text><text x="534" y="196">NIC·GPU4</text>
    <text x="534" y="229">NIC·GPU5</text><text x="534" y="262">NIC·GPU6</text>
    <text x="534" y="295">NIC·GPU7</text><text x="534" y="328">NIC·GPU8</text>
  </g>

  <text x="20" y="368" fill="#5a6b82" font-family="monospace" font-size="10">FRONT — air in</text>
  <text x="620" y="368" fill="#5a6b82" font-family="monospace" font-size="10" text-anchor="end">REAR — one 400 GbE port per GPU, air out</text>
</svg>
