<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Four-node VxRail cluster schematic">
  <rect width="320" height="220" fill="#0d1420"/>
  <!-- redundant top-of-rack switch pair -->
  <g font-family="Roboto, Arial, sans-serif">
    <rect x="24" y="14" width="130" height="22" rx="3" fill="#12282e" stroke="#2e5666"/>
    <text x="89" y="29" fill="#4fa0c9" font-size="10" text-anchor="middle">Top-of-rack switch A</text>
    <rect x="166" y="14" width="130" height="22" rx="3" fill="#12282e" stroke="#2e5666"/>
    <text x="231" y="29" fill="#4fa0c9" font-size="10" text-anchor="middle">Top-of-rack switch B</text>

    <!-- cluster network links -->
    <g stroke="#2e5666" stroke-width="1" opacity="0.6">
      <line x1="60" y1="36" x2="60" y2="52"/>
      <line x1="120" y1="36" x2="120" y2="52"/>
      <line x1="200" y1="36" x2="200" y2="52"/>
      <line x1="260" y1="36" x2="260" y2="52"/>
    </g>

    <!-- four identical HCI nodes -->
    <g>
      <!-- node 1 (primary — runs VxRail Manager) -->
      <rect x="24" y="52" width="272" height="30" rx="3" fill="#111a26" stroke="#3d5a9e"/>
      <rect x="30" y="58" width="26" height="18" rx="2" fill="#12233a" stroke="#3d5a9e"/>
      <text x="43" y="70" fill="#4f7cff" font-size="7" text-anchor="middle">NVMe</text>
      <rect x="62" y="58" width="150" height="18" rx="2" fill="#1a2433" stroke="#2b3a4f"/>
      <text x="137" y="70" fill="#8a9bb5" font-size="8" text-anchor="middle">CPU · memory · vSAN + ESXi</text>
      <!-- blue house marking the elected primary -->
      <g transform="translate(224,58)">
        <path d="M8 2 L16 8 L14 8 L14 16 L2 16 L2 8 L0 8 Z" fill="#0672cb" stroke="#4f9fe0"/>
        <rect x="6" y="10" width="4" height="6" fill="#0d1420"/>
      </g>
      <text x="270" y="70" fill="#4fa0c9" font-size="7" text-anchor="middle">Manager</text>

      <!-- nodes 2–4 (identical) -->
      <g>
        <rect x="24" y="96" width="272" height="30" rx="3" fill="#111a26" stroke="#3d5a9e"/>
        <rect x="30" y="102" width="26" height="18" rx="2" fill="#12233a" stroke="#3d5a9e"/>
        <text x="43" y="114" fill="#4f7cff" font-size="7" text-anchor="middle">NVMe</text>
        <rect x="62" y="102" width="228" height="18" rx="2" fill="#1a2433" stroke="#2b3a4f"/>
        <text x="176" y="114" fill="#8a9bb5" font-size="8" text-anchor="middle">CPU · memory · vSAN + ESXi</text>
      </g>
      <g>
        <rect x="24" y="140" width="272" height="30" rx="3" fill="#111a26" stroke="#3d5a9e"/>
        <rect x="30" y="146" width="26" height="18" rx="2" fill="#12233a" stroke="#3d5a9e"/>
        <text x="43" y="158" fill="#4f7cff" font-size="7" text-anchor="middle">NVMe</text>
        <rect x="62" y="146" width="228" height="18" rx="2" fill="#1a2433" stroke="#2b3a4f"/>
        <text x="176" y="158" fill="#8a9bb5" font-size="8" text-anchor="middle">CPU · memory · vSAN + ESXi</text>
      </g>
      <g>
        <rect x="24" y="184" width="272" height="30" rx="3" fill="#111a26" stroke="#3d5a9e"/>
        <rect x="30" y="190" width="26" height="18" rx="2" fill="#12233a" stroke="#3d5a9e"/>
        <text x="43" y="202" fill="#4f7cff" font-size="7" text-anchor="middle">NVMe</text>
        <rect x="62" y="190" width="228" height="18" rx="2" fill="#1a2433" stroke="#2b3a4f"/>
        <text x="176" y="202" fill="#8a9bb5" font-size="8" text-anchor="middle">CPU · memory · vSAN + ESXi</text>
      </g>
    </g>
  </g>
</svg>
