<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"
     aria-label="Schematic of the Dell NativeEdge platform architecture">
  <!-- Self-contained schematic drawn for this project — not a Dell product
       image. Palette matches the twin's dark diagram style. -->
  <rect x="0" y="0" width="640" height="380" fill="#0d1420"/>
  <text x="20" y="30" fill="#8fa3bd" font-family="monospace" font-size="15">DELL NATIVEEDGE — SCHEMATIC</text>
  <text x="20" y="50" fill="#5a6b82" font-family="monospace" font-size="11">an estate with no staff on site · one human action per site · everything pulled, never pushed</text>

  <!-- endpoint band -->
  <g fill="#2b2412" stroke="#6b5a2b">
    <rect x="20" y="70"  width="90" height="60" rx="4"/>
    <rect x="20" y="142" width="90" height="60" rx="4"/>
    <rect x="20" y="214" width="90" height="60" rx="4"/>
    <rect x="20" y="286" width="90" height="60" rx="4"/>
  </g>
  <g fill="#c9a94f" font-family="monospace" font-size="10">
    <text x="34" y="103">SITE 1</text><text x="34" y="175">SITE 2</text>
    <text x="34" y="247">SITE 3</text><text x="34" y="319">SITE 4</text>
  </g>

  <!-- WAN band -->
  <rect x="126" y="70" width="44" height="276" rx="4" fill="#12233a" stroke="#3d5a9e"/>
  <text x="148" y="212" fill="#4f7cff" font-family="monospace" font-size="10" text-anchor="middle" transform="rotate(-90 148 212)">WAN — intermittent by design</text>

  <!-- identity gate -->
  <rect x="186" y="160" width="90" height="90" rx="4" fill="#0f2a30" stroke="#2e5c66"/>
  <text x="231" y="198" fill="#4fa0c9" font-family="monospace" font-size="10" text-anchor="middle">SECURE</text>
  <text x="231" y="214" fill="#4fa0c9" font-family="monospace" font-size="10" text-anchor="middle">ONBOARDING</text>

  <!-- orchestrator -->
  <rect x="296" y="110" width="140" height="190" rx="4" fill="#1c1f3f" stroke="#5a4fc9"/>
  <text x="366" y="195" fill="#8f7fff" font-family="monospace" font-size="11" text-anchor="middle">NATIVEEDGE</text>
  <text x="366" y="212" fill="#8f7fff" font-family="monospace" font-size="11" text-anchor="middle">ORCHESTRATOR</text>

  <!-- right plane -->
  <rect x="456" y="70" width="80" height="60" rx="4" fill="#241f33" stroke="#4a4066"/>
  <text x="470" y="104" fill="#8a7ab5" font-family="monospace" font-size="10">BLUEPRINTS</text>
  <rect x="456" y="142" width="80" height="60" rx="4" fill="#22290f" stroke="#55662e"/>
  <text x="474" y="176" fill="#a0b54f" font-family="monospace" font-size="10">CATALOG</text>
  <rect x="552" y="70" width="70" height="60" rx="4" fill="#2b1a1a" stroke="#6b3a3a"/>
  <text x="562" y="98" fill="#c97a6a" font-family="monospace" font-size="10">ZERO</text>
  <text x="562" y="112" fill="#c97a6a" font-family="monospace" font-size="10">TRUST</text>
  <rect x="552" y="142" width="70" height="60" rx="4" fill="#16281a" stroke="#3a6647"/>
  <text x="558" y="170" fill="#6ab585" font-family="monospace" font-size="9">OBSERVE /</text>
  <text x="558" y="184" fill="#6ab585" font-family="monospace" font-size="9">AIOPS</text>

  <!-- flow arrows -->
  <g stroke="#2b3950" stroke-width="1.5" fill="none">
    <line x1="170" y1="205" x2="186" y2="205"/>
    <line x1="276" y1="205" x2="296" y2="205"/>
    <line x1="436" y1="150" x2="456" y2="120"/>
    <line x1="436" y1="205" x2="456" y2="180"/>
  </g>

  <text x="20" y="368" fill="#5a6b82" font-family="monospace" font-size="10">THE ESTATE — one human action each, ever</text>
  <text x="620" y="368" fill="#5a6b82" font-family="monospace" font-size="10" text-anchor="end">CONTROL &amp; INSIGHT — nobody visits a site</text>
</svg>
