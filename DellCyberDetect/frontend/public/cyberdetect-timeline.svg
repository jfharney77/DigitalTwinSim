<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="A snapshot timeline where corruption is invisible until the contents are read">
  <rect width="420" height="200" fill="#0d1420"/>

  <text x="210" y="20" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" letter-spacing="1.2" text-anchor="middle">SEEN FROM OUTSIDE — every copy looks the same</text>

  <!-- row 1: indistinguishable -->
  <g>
    <rect x="20" y="30" width="48" height="30" rx="3" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
    <rect x="76" y="30" width="48" height="30" rx="3" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
    <rect x="132" y="30" width="48" height="30" rx="3" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
    <rect x="188" y="30" width="48" height="30" rx="3" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
    <rect x="244" y="30" width="48" height="30" rx="3" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
    <rect x="300" y="30" width="48" height="30" rx="3" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
    <rect x="356" y="30" width="48" height="30" rx="3" fill="#1a2030" stroke="#3a4566" stroke-width="1"/>
  </g>
  <text x="210" y="74" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">metadata alerts: 0</text>

  <!-- the analysis -->
  <rect x="130" y="86" width="160" height="26" rx="4" fill="#241f33" stroke="#4a4066" stroke-width="1"/>
  <text x="210" y="103" fill="#8a7ab5" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">read the bytes inside</text>

  <text x="210" y="130" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" letter-spacing="1.2" text-anchor="middle">SEEN FROM INSIDE</text>

  <!-- row 2: revealed -->
  <g>
    <rect x="20" y="140" width="48" height="30" rx="3" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
    <rect x="76" y="140" width="48" height="30" rx="3" fill="#16281a" stroke="#3a6647" stroke-width="1"/>
    <rect x="132" y="140" width="48" height="30" rx="3" fill="#16281a" stroke="#0672cb" stroke-width="2"/>
    <rect x="188" y="140" width="48" height="30" rx="3" fill="#3d1414" stroke="#8c3a3a" stroke-width="1"/>
    <rect x="244" y="140" width="48" height="30" rx="3" fill="#3d1414" stroke="#8c3a3a" stroke-width="1"/>
    <rect x="300" y="140" width="48" height="30" rx="3" fill="#3d1414" stroke="#8c3a3a" stroke-width="1"/>
    <rect x="356" y="140" width="48" height="30" rx="3" fill="#3d1414" stroke="#8c3a3a" stroke-width="1"/>
  </g>
  <text x="156" y="135" fill="#0672cb" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">last clean</text>
  <text x="296" y="188" fill="#d98b8b" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">corrupted</text>
  <text x="76" y="188" fill="#6ab585" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">restorable</text>

  <text x="20" y="196" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="9">OLDEST</text>
  <text x="404" y="196" fill="#5a6b82" font-family="Roboto,Helvetica,Arial,sans-serif" font-size="9" text-anchor="end">NEWEST</text>
</svg>
